<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Selector de Color RGB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Estilos adicionales para el footer */
        footer {
          position: fixed;
          bottom: 0;
          width: 100%;
          background-color: #f8f9fa; /* Color de fondo */
          text-align: center; /* Centrado del texto */
          padding: 10px 0; /* Espaciado interior */
        }
      </style>

</head>

<body>
    <div class="container">

        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Aplicación de pruebas de color</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>

        <h2 class="text-center fw-bold text-dark mb-4 mt-5">🎨 Selector de Color RGB</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div id="colorBox" class="color-box rounded-top"></div>
                    <div class="card-body text-center">
                        <div class="d-flex align-items-center justify-content-center">
                            <p id="hexCode" class="fw-bold fs-4 m-0">#000000</p>
                            <button id="copyBtn" class="btn btn-outline-dark btn-sm ms-2">📋 Copiar</button>
                        </div>
                    </div>
                </div>

                <!-- Color Picker -->
                <div class="text-center mt-3">
                    <label for="colorPicker" class="form-label fw-bold">Selecciona un color:</label>
                    <input type="color" id="colorPicker" class="form-control-color">
                </div>

                <!-- Sliders y Campos de Entrada -->
                <div class="row mt-4">
                    <div class="col-6">
                        <label for="red" class="fw-bold">Rojo</label>
                        <input type="range" id="red" class="form-range custom-range" min="0" max="255" value="0">
                    </div>
                    <div class="col-6">
                        <input type="number" id="redInput" class="form-control text-center" min="0" max="255" value="0">
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-6">
                        <label for="green" class="fw-bold">Verde</label>
                        <input type="range" id="green" class="form-range custom-range" min="0" max="255" value="0">
                    </div>
                    <div class="col-6">
                        <input type="number" id="greenInput" class="form-control text-center" min="0" max="255"
                            value="0">
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-6">
                        <label for="blue" class="fw-bold">Azul</label>
                        <input type="range" id="blue" class="form-range custom-range" min="0" max="255" value="0">
                    </div>
                    <div class="col-6">
                        <input type="number" id="blueInput" class="form-control text-center" min="0" max="255"
                            value="0">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
